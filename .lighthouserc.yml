ci:
  collect:
    # Audit the live site. Replace with http://localhost:4173 when running against
    # a local preview build (npm run build && npm run preview).
    url:
      - "https://moelshrief.wiki"
    numberOfRuns: 1
  assert:
    preset: "lighthouse:no-pwa"
    assertions:
      # Core Web Vitals / performance
      categories:performance:
        - warn
        - minScore: 0.8
      categories:accessibility:
        - error
        - minScore: 0.9
      categories:best-practices:
        - warn
        - minScore: 0.9
      categories:seo:
        - warn
        - minScore: 0.9
      # Individual audits
      first-contentful-paint:
        - warn
        - maxNumericValue: 3000
      largest-contentful-paint:
        - warn
        - maxNumericValue: 4000
      cumulative-layout-shift:
        - warn
        - maxNumericValue: 0.1
      total-blocking-time:
        - warn
        - maxNumericValue: 600
  upload:
    target: temporary-public-storage
